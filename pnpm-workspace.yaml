allowBuilds:
  # Optional postinstall-only helpers (pi-ai transitive deps): nothing at
  # runtime needs their build scripts; refusing keeps installs hermetic.
  '@google/genai': false
  protobufjs: false

# Resolve the auth bundle's local type-check tree against the DSH line used by
# the parent Aitui package.
overrides:
  '@deepseek-ai/cordis': 4.0.5
  '@deepseek-ai/schemastery': 3.18.5
  '@deepseek-ai/dsh-agent': 0.2.1-rc.2
  '@deepseek-ai/dsh-attachment': 0.2.1-rc.2
  '@deepseek-ai/dsh-brand': 0.2.1-rc.2
  '@deepseek-ai/dsh-commands': 0.2.1-rc.2
  '@deepseek-ai/dsh-llm': 0.2.1-rc.2
  '@deepseek-ai/dsh-llm-pi-ai': 0.2.1-rc.2
  '@deepseek-ai/dsh-session': 0.2.1-rc.2
  '@deepseek-ai/dsh-user-questions': 0.2.1-rc.2
  '@deepseek-ai/dsh-authorization': 0.2.1-rc.2
  '@deepseek-ai/dsh-credentials': 0.2.1-rc.2
  '@deepseek-ai/dsh-launch-environment': 0.2.1-rc.2
  '@deepseek-ai/dsh-settings': 0.2.1-rc.2
  '@deepseek-ai/dsh-timeout': 0.2.1-rc.2
  '@deepseek-ai/dsh-typert-protocol': 0.2.1-rc.2

# DSH release cohorts are intentionally verified on prerelease versions.
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'
